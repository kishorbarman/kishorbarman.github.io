<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Kishor Barman</title>
    <meta name="description" content="A few random vibe coding experiments.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #60a5fa;
            --accent-dim: rgba(96, 165, 250, 0.15);
            --border: rgba(148, 163, 184, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #93c5fd;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* --- Header --- */
        .page-header {
            padding: 100px 0 60px;
        }

        .page-header .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeSlideUp 0.6s ease forwards 0.1s;
        }

        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            opacity: 0;
            animation: fadeSlideUp 0.6s ease forwards 0.25s;
        }

        .back-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-top: 12px;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards 0.3s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        /* --- Project Cards --- */
        .projects-grid {
            display: grid;
            gap: 20px;
            padding-bottom: 80px;
        }

        .project-card {
            display: block;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            opacity: 0;
            animation: fadeSlideUp 0.6s ease forwards;
        }

        .project-card:nth-child(1) { animation-delay: 0.35s; }
        .project-card:nth-child(2) { animation-delay: 0.5s; }
        .project-card:nth-child(3) { animation-delay: 0.65s; }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: rgba(96, 165, 250, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .project-card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-card h2 .arrow {
            color: var(--accent);
            transition: transform 0.2s;
            font-size: 1.1rem;
        }

        .project-card:hover h2 .arrow {
            transform: translateX(4px);
        }

        .project-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* --- Footer --- */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 32px 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        /* --- Keyframes --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .page-header {
                padding: 80px 0 40px;
            }

            .page-header .container {
                flex-direction: column;
            }

            .back-link {
                margin-top: 0;
                margin-bottom: 24px;
                order: -1;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .project-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="container">
            <div>
                <h1>Projects</h1>
                <p class="subtitle">A few random vibe coding experiments.</p>
            </div>
            <a href="index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Home
            </a>
        </div>
    </div>

    <div class="container">
        <div class="projects-grid">
            <a href="games/index.html" class="project-card">
                <h2>Games <span class="arrow">&rarr;</span></h2>
                <p>Small games and interactive experiments.</p>
            </a>
            <a href="market/index.html" class="project-card">
                <h2>S&P 500 Heatmap <span class="arrow">&rarr;</span></h2>
                <p>A heatmap of S&P 500 stocks.</p>
            </a>
            <a href="pulse/index.html" class="project-card">
                <h2>Pulse Board <span class="arrow">&rarr;</span></h2>
                <p>A real-time dashboard for tracking key metrics.</p>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Kishor Barman</p>
    </footer>
</body>
</html>
